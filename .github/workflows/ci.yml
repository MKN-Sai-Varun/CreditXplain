name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Model and API tests
    # Python 3.9 matches the development machine; GitHub provides 3.9 builds
    # for Ubuntu 22.04 and 24.04 but not for 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The trained model and processed data are not in git, so tests that need
      # them skip here; -rs lists what was skipped and why.
      - name: Run tests
        run: python -m pytest tests backend/tests -q -rs

  frontend:
    name: Frontend lint, build and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # next build generates the route types that the type check below relies on
      - run: npm run build
      - run: npx tsc --noEmit
